<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontak — My Spaces</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <nav>
      <a href="index.html" class="logo">My <span>Spaces</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="artikel.html">Artikel</a>
        <a href="about.html">About</a>
        <a href="kontak.html">Kontak</a>
        <button class="theme-btn" aria-label="Toggle dark mode">🌙</button>
      </div>
    </nav>

    <main style="max-width:640px;margin:60px auto">
      <div class="kicker">get in touch</div>
      <h2 style="margin-bottom:8px">Kirim pesan.</h2>
      <p style="color:var(--muted);margin-bottom:28px">
        Ada pertanyaan, kolaborasi, atau cuma ingin menyapa? Tulis di bawah ini.
      </p>

      <div id="success-msg" class="success" style="display:none">
        ✓ Pesanmu sudah terkirim. Terima kasih!
      </div>

      <form id="contact-form">
        <div class="form-group">
          <label>Nama</label>
          <input required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" required>
        </div>
        <div class="form-group">
          <label>Pesan</label>
          <textarea rows="5" required></textarea>
        </div>
        <button type="submit" class="btn">Kirim pesan →</button>
      </form>
    </main>

    <footer>
      <span>© 2026 My Spaces · Ree</span>
      <span>私の小さな場所。</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
